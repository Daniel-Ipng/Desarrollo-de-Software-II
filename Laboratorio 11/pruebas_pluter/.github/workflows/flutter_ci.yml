name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Pruebas unitarias + umbral de cobertura (85 %)
        env:
          MIN_COVERAGE: "85"
        run: |
          chmod +x scripts/check_coverage.sh
          ./scripts/check_coverage.sh

      - name: Publicar reporte de cobertura limpio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clean-lcov
          path: coverage/clean_lcov.info
          if-no-files-found: ignore
