# Pega esto dentro de "dependencies:" de tu pubspec.yaml y ejecuta: flutter pub get
dependencies:
  flutter:
    sdk: flutter
  geolocator: ^11.0.0          # GPS
  geocoding: ^3.0.0            # Geocodificación directa/inversa
  flutter_map: ^6.1.0          # Mapa open-source (reemplaza a Google Maps)
  latlong2: ^0.9.0             # Coordenadas para flutter_map
  camera: ^0.10.5+9            # Cámara
  image_picker: ^1.0.7         # Galería / cámara rápida
  path_provider: ^2.1.2
  permission_handler: ^11.2.0
